[project]
name = "sheetreader"
version = "0.1.0"
description = "Read Google Sheets into typed Python rows, with retry and a tiny CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muhammad Subhi" }]
keywords = ["google-sheets", "api", "automation", "cli"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sheetreader = "sheetreader.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sheetreader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
